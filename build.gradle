plugins {
    id 'java'
    id 'application'
}

group = 'org.example'
version = '0.1.0'

sourceCompatibility = '23'
targetCompatibility = '23'
mainClassName = 'org.example.TodoApp'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}
